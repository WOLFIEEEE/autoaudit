notes: |
  A deliberately accessible signup form: labelled inputs, autocomplete
  tokens, a fieldset for the radio group, a skip link, landmarks, a
  visible focus indicator, 44px targets, and reduced-motion /
  forced-colors / prefers-contrast queries.

  ANY finding here is a false positive by definition. That is the whole
  job of this fixture — it needs no human labelling and it is the
  cheapest false-positive detector we have.

  The forbidden list is every rule belonging to a module that actually
  executed against this page (109 of them), not every rule in the
  codebase: a rule that cannot fire here is not evidence of anything and
  padding the list would inflate the negative-coverage metric.

  Two genuine false positives were found and fixed when this fixture was
  written:
    - forms-missing-autocomplete fired on a radio button whose id merely
      contained "email" (id="pref-email"). Radios carry no autocomplete
      token; _needs_autocomplete now gates on input type first.
    - sr-label-in-name fired on a correctly labelled <select> because the
      focus probe took innerText (the OPTION text) as the visible label.
      Form controls now resolve through their <label>.
expected: []
